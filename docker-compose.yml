services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rrtrack_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - rrtrack_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: rrtrack_nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rrtrack_network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: rrtrack_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rrtrack}
      MYSQL_USER: ${DB_USERNAME:-rrtrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3307:3306"
    volumes:
      - rrtrack_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - rrtrack_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rrtrack_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      UPLOAD_LIMIT: 100M
    ports:
      - "8889:80"
    networks:
      - rrtrack_network
    depends_on:
      db:
        condition: service_healthy

  # Redis Cache (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: rrtrack_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - rrtrack_redis_data:/data
    networks:
      - rrtrack_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  rrtrack_network:
    driver: bridge

volumes:
  rrtrack_mysql_data:
    driver: local
  rrtrack_redis_data:
    driver: local
